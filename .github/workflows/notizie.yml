name: Aggiorna notizie

on:
  schedule:
    - cron: "17 * * * *"   # ogni ora, al minuto 17 (orario UTC)
  workflow_dispatch:        # permette l'avvio a mano dalla scheda Actions

permissions:
  contents: write   # per salvare la pagina nel repository
  pages: write      # per pubblicarla su GitHub Pages
  id-token: write

concurrency:
  group: notizie-update
  cancel-in-progress: false   # queue runs instead of running them in parallel

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ... your step that generates docs/index.html ...

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet && exit 0   # nothing changed, skip
          git commit -m "Notizie $(date +'%d/%m %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1s: actions/deploy-pages@v4

name: Aggiorna notizie

on:
  schedule:
    # GitHub non garantisce le esecuzioni programmate: con carico alto le
    # ritarda o le salta. Tre orari per ora fanno sì che almeno uno parta.
    - cron: "7,27,47 * * * *"   # orario UTC
  workflow_dispatch:            # avvio a mano dalla scheda Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: notizie
  cancel-in-progress: true      # se ne parte una nuova, quella vecchia non serve più

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Rome   # orari della pagina in ora italiana
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Genera la pagina
        run: |
          python genera_notizie_google.py --no-browser --ricarica 20
          mkdir -p site
          mv notizie_google.html site/index.html

      - uses: actions/configure-pages@v5

      # Nota: non usare "Re-run" su un'esecuzione fallita (crea un secondo
      # pacchetto github-pages e la pubblicazione fallisce): avviane una nuova
      # con "Run workflow".
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
